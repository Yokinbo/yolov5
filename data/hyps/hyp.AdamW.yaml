# ==== LR & 正则（配合 AdamW）====
lr0: 0.005          # 初始学习率（AdamW 稳）
lrf: 0.01           # 最终学习率比例（配合 --cos-lr）
momentum: 0.937
weight_decay: 0.01  # AdamW建议 0.01；若用SGD改成 0.0005

# ==== warmup ====
warmup_epochs: 2.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# ==== 损失与匹配 ====
box: 0.05
cls: 0.0            # 单类可设 0；不影响
cls_pw: 1.0
obj: 1.5            # 提高 obj 权重，改善置信度校准
obj_pw: 1.0
iou_t: 0.25         # 匹配阈值（稳）
anchor_t: 4.0
fl_gamma: 0.0

# ==== 数据增强（先稳，再开大）====
hsv_h: 0.015
hsv_s: 0.40
hsv_v: 0.30
degrees: 5.0
translate: 0.10
scale: 0.20
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.10        # 先低；收敛不稳时不要开太大
mixup: 0.0
copy_paste: 0.0
