# Parameters
nc: 80 # number of classes
depth_multiple: 0.33 # model depth multiple  深度倍数    网络深度（网络层数）。作用在number上，乘以系数
width_multiple: 0.50 # layer channel multiple  通道倍数，一个层输出的通道数越多，表示这一层越宽。  网络宽度（网络输出通道）。作用在args第一个参数上。
anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8            低层的anchor
  - [30, 61, 62, 45, 59, 119] # P4/16          中层的anchor
  - [116, 90, 156, 198, 373, 326] # P5/32      高层的anchor

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]   number表示模块的数量  args表示参数
  # 可以把 backbone 理解成“主干特征提取网络”:
  # 输入图像后不断下采样，得到 P3/P4/P5 等不同尺度的特征图。
  [
    [-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2  P1为金字塔的第一层  2表示为原图的二分之一  [64, 6, 2, 2]中，64为输出通道数，6为卷积核的尺寸，2为卷积核的步长，2为padding的大小
    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4
    [-1, 3, C3, [128]], # C3: 当前阶段的主要特征提取模块
    [-1, 1, Conv, [256, 3, 2]], # 3-P3/8
    [-1, 6, C3, [256]], # 输出可作为后面小目标检测分支的重要浅层特征
    [-1, 1, Conv, [512, 3, 2]], # 5-P4/16
    [-1, 9, C3, [512]], # 中层语义和细节相对平衡
    [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32  P5为金字塔的第五层  32表示为原图的三十二分之一
    [-1, 3, C3, [1024]], # 最深层特征，语义最强，分辨率最小
    [-1, 1, SPPF, [1024, 5]], # 9  在 backbone 末端进一步扩大感受野
  ]

# YOLOv5 v6.0 head
head: [
    # 这里的 head 实际上同时承担 Neck + Detect Head 的角色:
    # 前半段做上采样、拼接、融合(Neck)，最后一层 Detect 才是真正输出预测结果的 Head。
    [-1, 1, Conv, [512, 1, 1]], # 先压缩通道，方便后续上采样融合
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 上采样到和 P4 一样大
    [[-1, 6], 1, Concat, [1]], # cat backbone P4  与 backbone 的 P4 特征拼接
    [-1, 3, C3, [512, False]], # 13  融合后的 P4 特征

    [-1, 1, Conv, [256, 1, 1]], # 继续压缩通道
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 上采样到和 P3 一样大
    [[-1, 4], 1, Concat, [1]], # cat backbone P3  与 backbone 的 P3 特征拼接
    [-1, 3, C3, [256, False]], # 17 (P3/8-small，用来预测小目标)

    [-1, 1, Conv, [256, 3, 2]], # 再次下采样，回到 P4 尺度
    [[-1, 14], 1, Concat, [1]], # cat head P4  与上面融合好的 P4 特征再拼接
    [-1, 3, C3, [512, False]], # 20 (P4/16-medium，用来预测中目标)

    [-1, 1, Conv, [512, 3, 2]], # 再次下采样，回到 P5 尺度
    [[-1, 10], 1, Concat, [1]], # cat head P5  与最深层特征再拼接
    [-1, 3, C3, [1024, False]], # 23 (P5/32-large，用来预测大目标)

    [[17, 20, 23], 1, Detect, [nc, anchors]], # Detect(P3, P4, P5) 三个尺度一起送入检测头
  ]
