# Parameters
nc: 80 # number of classes
depth_multiple: 0.33 # model depth multiple  深度倍数    网络深度（网络层数）。作用在number上，乘以系数
width_multiple: 0.50 # layer channel multiple  通道倍数，一个层输出的通道数越多，表示这一层越宽。  网络宽度（网络输出通道）。作用在args第一个参数上。
anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8            低层的anchor
  - [30, 61, 62, 45, 59, 119] # P4/16          中层的anchor
  - [116, 90, 156, 198, 373, 326] # P5/32      高层的anchor

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]   number表示模块的数量  args表示参数
  [
    [-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2  P1为金字塔的第一层  2表示为原图的二分之一  [64, 6, 2, 2]中，64为输出通道数，6为卷积核的尺寸，2为卷积核的步长，2为padding的大小
    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4
    [-1, 3, C3, [128]],
    [-1, 1, Conv, [256, 3, 2]], # 3-P3/8
    [-1, 6, C3, [256]],
    [-1, 1, Conv, [512, 3, 2]], # 5-P4/16
    [-1, 9, C3, [512]],
    [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32  P5为金字塔的第五层  32表示为原图的三十二分之一
    [-1, 3, C3, [1024]],
    [-1, 1, SPPF, [1024, 5]], # 9
  ]

# YOLOv5 v6.0 head
head: [
    [-1, 1, Conv, [512, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 6], 1, Concat, [1]], # cat backbone P4
    [-1, 3, C3, [512, False]], # 13

    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]], # cat backbone P3
    [-1, 3, C3, [256, False]], # 17 (P3/8-small，用来预测小目标)

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 14], 1, Concat, [1]], # cat head P4
    [-1, 3, C3, [512, False]], # 20 (P4/16-medium)

    [-1, 1, Conv, [512, 3, 2]],
    [[-1, 10], 1, Concat, [1]], # cat head P5
    [-1, 3, C3, [1024, False]], # 23 (P5/32-large，用来预测大目标)

    [[17, 20, 23], 1, Detect, [nc, anchors]], # Detect(P3, P4, P5)
  ]
